<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

    <!-- Title -->
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">
      💱 Currency Converter
    </h2>

    <!-- Amount Input -->
    <div class="mb-4">
      <input 
        type="number" 
        id="amount" 
        placeholder="Enter amount"
        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
      />
    </div>

    <!-- Currency Selectors -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      
      <select 
        id="fromCurrency"
        class="px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="ETB">ETB</option>
      </select>

      <select 
        id="toCurrency"
        class="px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
      >
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="ETB">ETB</option>
      </select>

    </div>

    <!-- Buttons -->
    <div class="flex gap-4 mb-6">
      
      <button 
        id="convertBtn"
        class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md"
      >
        Convert
      </button>

      <button 
        id="resetBtn"
        class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-300 transition duration-200"
      >
        Reset
      </button>

    </div>

    <!-- Result -->
    <div class="text-center">
      <h3 
        id="result"
        class="text-lg font-semibold text-gray-800 min-h-[28px]"
      ></h3>
    </div>

  </div>

  <script src="converter.js"></script>

</body>
</html>
